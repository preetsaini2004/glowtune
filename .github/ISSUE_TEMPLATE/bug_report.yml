name: Something isn't working
description: Report a bug. A screenshot and a few lines are enough.
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Spotify
        - Apple Music
        - YouTube Music
        - SoundCloud
        - Desktop scene (lyrics, album art, blocks, layout)
        - Lyrics view
        - Edge glow / lighting
        - Ad blocking
        - Taskbar buttons or keyboard keys
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What went wrong?
      description: What you did, what happened, and what you expected instead.
      placeholder: |
        I opened Apple Music, played a song from my library, and Up next stayed empty.
        I expected it to list the next songs from my queue.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or screen recording
      description: Drag images or videos into this box. Hide anything private (emails, account names) first.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Glowtune version
      description: Shown in Settings → About, or the installer's file name.
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: dropdown
    id: again
    attributes:
      label: Does it happen every time?
      options:
        - Every time
        - Sometimes
        - Only once so far
