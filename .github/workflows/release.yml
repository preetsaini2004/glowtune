# Builds the Windows installer from a version tag (git tag v0.1.0 && git push --tags)
# (the Check workflow already tests every push to main)
# and attaches it, with its SHA-256, to a DRAFT release. Publish the draft by hand
# after testing the installer.
#
# Code signing (recommended, so Windows SmartScreen trusts the installer): add an
# `app/src-tauri/tauri.windows.conf.json` with `bundle.windows.signCommand` for your
# signing service (for example Azure Trusted Signing) and its secrets to the repo.
# Without it, the installer is unsigned and SmartScreen shows "More info → Run anyway".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Build the installer
        shell: bash
        run: |
          cd app
          pnpm tauri build

      - name: Checksums
        shell: bash
        run: |
          cd target/release/bundle/nsis
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/release/bundle/nsis/*.exe \
            target/release/bundle/nsis/SHA256SUMS.txt \
            --draft --title "Glowtune ${GITHUB_REF_NAME#v}" --generate-notes
