[package]
name = "glowtune"
description = "Glowtune desktop music companion"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name
# (needed on Windows, see https://github.com/rust-lang/cargo/issues/8519).
name = "glowtune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-single-instance = "2.5"
tauri-plugin-dialog = "2"
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
tokio = { version = "1", features = ["macros"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
media_source = { path = "../../crates/media_source" }
analysis = { path = "../../crates/analysis" }
audio_capture = { path = "../../crates/audio_capture" }
lyrics = { path = "../../crates/lyrics" }
themes = { path = "../../crates/themes" }
adblock_layer = { path = "../../crates/adblock_layer" }
overlay = { path = "../../crates/overlay" }

[target.'cfg(windows)'.dependencies]
# Must match the versions Tauri uses, so WebView2 COM types line up.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Com", "Win32_Graphics_Gdi"] }

# Release profile lives in the workspace root Cargo.toml.
