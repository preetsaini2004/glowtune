[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["Preet"]

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"

# Performance budget (PLAN.md section 9)
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

# Optimize dependencies even in dev builds (image decoding, wgpu, etc. are
# 10–50x slower unoptimized). Our own crates stay fast to compile.
[profile.dev.package."*"]
opt-level = 2
